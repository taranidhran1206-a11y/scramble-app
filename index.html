<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Scramble Master</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    @keyframes bounce-short {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .animate-bounce-short {
      animation: bounce-short 0.3s ease-in-out;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 15px rgba(6, 182, 212, 0.3); }
      50% { box-shadow: 0 0 25px rgba(20, 184, 166, 0.6); }
    }
    .glow-effect {
      animation: pulse-glow 2s infinite;
    }
  </style>
</head>
<!-- Turquoise and Sky Blue mixed gradient background -->
<body class="min-h-screen bg-gradient-to-br from-teal-700 via-cyan-700 to-sky-800 text-slate-100 font-sans selection:bg-cyan-300 selection:text-cyan-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Web Audio Sound Synthesizer
    const playAudio = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();

        if (type === 'correct') {
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
            gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.08);
            osc.stop(ctx.currentTime + idx * 0.08 + 0.3);
          });
        } else if (type === 'wrong') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        } else if (type === 'click') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'shuffle') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.2);
        }
      } catch (e) {
        // Audio might be suspended until first click
      }
    };

    const WORD_BANK = {
      "Tech & Code": [
        { word: "REACT", clue: "A declarative JavaScript library for building user interfaces" },
        { word: "PYTHON", clue: "A versatile, readable snake-named programming language" },
        { word: "JAVASCRIPT", clue: "The interactive language running natively in web browsers" },
        { word: "DATABASE", clue: "An organized system for storing, managing, and querying data" },
        { word: "ALGORITHM", clue: "Step-by-step procedure or formula for solving problems" },
        { word: "COMPILER", clue: "Translates human-written code into machine instructions" },
        { word: "TERMINAL", clue: "Command-line text interface to interact with your system" },
        { word: "CONTAINER", clue: "Standard package of software bundling code and dependencies" }
      ],
      "Animals": [
        { word: "ELEPHANT", clue: "The largest living land mammal with tusks and trunk" },
        { word: "CHAMELEON", clue: "A reptile famous for changing colors and 360-degree eyes" },
        { word: "DOLPHIN", clue: "A highly intelligent, social aquatic mammal" },
        { word: "PENGUIN", clue: "Flightless tuxedo-feathered bird thriving in cold seas" },
        { word: "KANGAROO", clue: "Australian marsupial known for powerful hind legs and hopping" },
        { word: "OCTOPUS", clue: "Eight-limbed soft-bodied mollusk with three hearts" }
      ],
      "Space & Sci": [
        { word: "GALAXY", clue: "A massive system of billions of stars, interstellar gas, and dust" },
        { word: "TELESCOPE", clue: "An optical instrument designed to observe distant stars and planets" },
        { word: "ASTEROID", clue: "A rocky astronomical object orbiting the Sun" },
        { word: "QUANTUM", clue: "The minimum discrete quantity of energy in physics" },
        { word: "SUPERNOVA", clue: "A colossal, luminous explosion marking the end of a star" },
        { word: "GRAVITY", clue: "The fundamental attraction pulling objects toward each other" }
      ],
      "Everyday": [
        { word: "AVOCADO", clue: "A buttery green pear-shaped fruit popular for guacamole" },
        { word: "CHOCOLATE", clue: "A sweet confection made from roasted cacao seeds" },
        { word: "VOLCANO", clue: "A mountain opening down to a pool of molten rock below" },
        { word: "HORIZON", clue: "The boundary line where Earth appears to meet the sky" },
        { word: "PYRAMID", clue: "Monumental stone structure with triangular outer surfaces" }
      ]
    };

    function scrambleLetters(word) {
      const arr = word.split('');
      if (arr.length <= 2) return arr.reverse().join('');
      let result = word;
      let count = 0;
      while (result === word && count < 20) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        result = arr.join('');
        count++;
      }
      return result;
    }

    function ScrambleApp() {
      const [category, setCategory] = useState("Tech & Code");
      const [currentWordObj, setCurrentWordObj] = useState(null);
      const [scrambled, setScrambled] = useState([]);
      const [usedTileIndexes, setUsedTileIndexes] = useState([]);
      const [userGuess, setUserGuess] = useState("");
      const [score, setScore] = useState(0);
      const [streak, setStreak] = useState(0);
      const [highScore, setHighScore] = useState(() => {
        return parseInt(localStorage.getItem("scramble_high_score") || "0", 10);
      });
      const [revealedLetter, setRevealedLetter] = useState(false);
      const [statusMessage, setStatusMessage] = useState({ text: "", type: "" });
      const [timerEnabled, setTimerEnabled] = useState(true);
      const [timeLeft, setTimeLeft] = useState(30);
      const [soundMuted, setSoundMuted] = useState(false);
      const [isShaking, setIsShaking] = useState(false);

      const timerRef = useRef(null);

      const triggerSound = (type) => {
        if (!soundMuted) playAudio(type);
      };

      const nextWord = (newCategory = category) => {
        const wordList = WORD_BANK[newCategory];
        let chosen;
        do {
          chosen = wordList[Math.floor(Math.random() * wordList.length)];
        } while (currentWordObj && wordList.length > 1 && chosen.word === currentWordObj.word);

        const scrambledStr = scrambleLetters(chosen.word);
        setCurrentWordObj(chosen);
        setScrambled(scrambledStr.split(''));
        setUsedTileIndexes([]);
        setUserGuess("");
        setRevealedLetter(false);
        setStatusMessage({ text: "", type: "" });
        setTimeLeft(30);
      };

      useEffect(() => {
        nextWord(category);
      }, [category]);

      useEffect(() => {
        if (!timerEnabled || !currentWordObj) return;

        clearInterval(timerRef.current);
        timerRef.current = setInterval(() => {
          setTimeLeft((prev) => {
            if (prev <= 1) {
              clearInterval(timerRef.current);
              handleTimeout();
              return 0;
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(timerRef.current);
      }, [currentWordObj, timerEnabled]);

      const handleTimeout = () => {
        triggerSound('wrong');
        setIsShaking(true);
        setTimeout(() => setIsShaking(false), 500);
        setStatusMessage({
          text: `Time's up! The word was "${currentWordObj.word}"`,
          type: "error"
        });
        setStreak(0);
      };

      const handleTileClick = (letter, index) => {
        if (usedTileIndexes.includes(index)) return;
        triggerSound('click');
        setUserGuess((prev) => prev + letter);
        setUsedTileIndexes((prev) => [...prev, index]);
      };

      const handleBackspace = () => {
        if (userGuess.length === 0) return;
        triggerSound('click');
        setUserGuess((prev) => prev.slice(0, -1));
        setUsedTileIndexes((prev) => prev.slice(0, -1));
      };

      const handleClear = () => {
        triggerSound('click');
        setUserGuess("");
        setUsedTileIndexes([]);
      };

      const handleReshuffle = () => {
        triggerSound('shuffle');
        const scrambledStr = scrambleLetters(currentWordObj.word);
        setScrambled(scrambledStr.split(''));
        handleClear();
      };

      const handleCheck = () => {
        if (!currentWordObj) return;
        const normalizedGuess = userGuess.trim().toUpperCase();

        if (normalizedGuess === currentWordObj.word) {
          triggerSound('correct');
          if (typeof confetti === 'function') {
            confetti({
              particleCount: 80,
              spread: 60,
              origin: { y: 0.7 }
            });
          }

          const basePoints = 10;
          const hintPenalty = revealedLetter ? 3 : 0;
          const timeBonus = timerEnabled ? Math.floor(timeLeft / 5) : 0;
          const earned = Math.max(2, basePoints - hintPenalty + timeBonus);

          const newScore = score + earned;
          const newStreak = streak + 1;
          setScore(newScore);
          setStreak(newStreak);

          if (newScore > highScore) {
            setHighScore(newScore);
            localStorage.setItem("scramble_high_score", newScore.toString());
          }

          setStatusMessage({
            text: `Awesome! +${earned} points (${basePoints - hintPenalty} base + ${timeBonus} time bonus)!`,
            type: "success"
          });

          setTimeout(() => {
            nextWord(category);
          }, 1400);
        } else {
          triggerSound('wrong');
          setIsShaking(true);
          setTimeout(() => setIsShaking(false), 500);
          setStatusMessage({
            text: "Not quite! Try again or reshuffle.",
            type: "error"
          });
        }
      };

      const handleRevealFirstLetter = () => {
        if (!revealedLetter) {
          triggerSound('click');
          setRevealedLetter(true);
        }
      };

      const handleSkip = () => {
        triggerSound('wrong');
        setStatusMessage({
          text: `Skipped! The word was "${currentWordObj.word}".`,
          type: "error"
        });
        setStreak(0);
        setTimeout(() => {
          nextWord(category);
        }, 1500);
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

          if (e.key === 'Backspace') {
            e.preventDefault();
            handleBackspace();
          } else if (e.key === 'Enter') {
            e.preventDefault();
            handleCheck();
          } else {
            const char = e.key.toUpperCase();
            if (/^[A-Z]$/.test(char) && currentWordObj) {
              const availableIndex = scrambled.findIndex(
                (l, idx) => l === char && !usedTileIndexes.includes(idx)
              );
              if (availableIndex !== -1) {
                handleTileClick(char, availableIndex);
              }
            }
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [scrambled, usedTileIndexes, userGuess, currentWordObj]);

      return (
        <div className="max-w-2xl mx-auto px-4 py-8 flex flex-col items-center">
          {/* Header */}
          <header className="w-full flex items-center justify-between mb-6 pb-4 border-b border-white/10 backdrop-blur-sm">
            <div className="flex items-center gap-3">
              <span className="text-3xl filter drop-shadow">🧩</span>
              <div>
                <h1 className="text-2xl font-extrabold bg-gradient-to-r from-teal-200 via-cyan-100 to-sky-200 bg-clip-text text-transparent">
                  Word Scramble
                </h1>
                <p className="text-xs text-cyan-100/70">Unscramble the letters to win!</p>
              </div>
            </div>

            <div className="flex items-center gap-2.5">
              <button
                onClick={() => setSoundMuted(!soundMuted)}
                className="p-2 rounded-xl bg-slate-950/40 hover:bg-slate-950/60 border border-white/10 text-cyan-200 text-sm transition"
                title={soundMuted ? "Unmute" : "Mute"}
              >
                {soundMuted ? "🔇" : "🔊"}
              </button>
              <button
                onClick={() => setTimerEnabled(!timerEnabled)}
                className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition border ${
                  timerEnabled
                    ? "bg-teal-500/30 text-teal-100 border-teal-300/40"
                    : "bg-slate-950/40 text-slate-300 border-white/10"
                }`}
              >
                ⏱️ {timerEnabled ? `${timeLeft}s` : "Relaxed"}
              </button>
            </div>
          </header>

          {/* Stats Bar */}
          <div className="w-full grid grid-cols-3 gap-3 mb-6">
            <div className="bg-slate-950/60 backdrop-blur-md border border-cyan-400/20 rounded-2xl p-3 text-center shadow-lg">
              <span className="text-[11px] font-semibold text-cyan-200/70 block uppercase tracking-wider">SCORE</span>
              <span className="text-2xl font-extrabold text-cyan-300">{score}</span>
            </div>
            <div className="bg-slate-950/60 backdrop-blur-md border border-cyan-400/20 rounded-2xl p-3 text-center shadow-lg">
              <span className="text-[11px] font-semibold text-cyan-200/70 block uppercase tracking-wider">STREAK</span>
              <span className="text-2xl font-extrabold text-amber-300">
                {streak > 0 ? `🔥 ${streak}` : "0"}
              </span>
            </div>
            <div className="bg-slate-950/60 backdrop-blur-md border border-cyan-400/20 rounded-2xl p-3 text-center shadow-lg">
              <span className="text-[11px] font-semibold text-cyan-200/70 block uppercase tracking-wider">BEST</span>
              <span className="text-2xl font-extrabold text-emerald-300">{highScore}</span>
            </div>
          </div>

          {/* Category Selector */}
          <div className="w-full mb-6">
            <label className="text-xs font-bold text-cyan-100/80 uppercase tracking-wider mb-2 block">
              Category
            </label>
            <div className="flex flex-wrap gap-2">
              {Object.keys(WORD_BANK).map((cat) => (
                <button
                  key={cat}
                  onClick={() => {
                    if (cat !== category) {
                      triggerSound('click');
                      setCategory(cat);
                    }
                  }}
                  className={`px-3.5 py-1.5 rounded-xl text-sm font-semibold transition border ${
                    category === cat
                      ? "bg-cyan-500 text-slate-950 border-cyan-300 shadow-lg shadow-cyan-500/30"
                      : "bg-slate-950/40 text-cyan-100 border-white/10 hover:bg-slate-950/60"
                  }`}
                >
                  {cat}
                </button>
              ))}
            </div>
          </div>

          {/* Main Game Card */}
          <div
            className={`w-full bg-slate-950/75 backdrop-blur-xl border border-cyan-400/20 rounded-3xl p-6 shadow-2xl transition-transform ${
              isShaking ? "animate-bounce-short border-red-400" : ""
            }`}
          >
            {/* Automatic Clue Banner */}
            {currentWordObj && (
              <div className="mb-6 p-4 rounded-2xl bg-gradient-to-r from-teal-950/80 to-cyan-950/80 border border-teal-400/30 shadow-inner text-center">
                <span className="inline-block text-[11px] font-bold text-teal-300 uppercase tracking-widest bg-teal-900/60 px-2.5 py-0.5 rounded-full mb-1.5 border border-teal-400/30">
                  🔍 Clue
                </span>
                <p className="text-sm md:text-base font-medium text-cyan-100">
                  "{currentWordObj.clue}"
                </p>
                {revealedLetter && (
                  <p className="mt-2 text-xs font-semibold text-amber-300">
                    💡 Starts with letter: <span className="text-sm font-bold underline">{currentWordObj.word[0]}</span>
                  </p>
                )}
              </div>
            )}

            {/* Scrambled Letters Display */}
            <div className="text-center mb-6">
              <span className="text-xs text-cyan-200/60 uppercase tracking-widest font-semibold block mb-2.5">
                Click or Type Letters
              </span>
              <div className="flex flex-wrap items-center justify-center gap-2.5 min-h-[58px]">
                {scrambled.map((letter, idx) => {
                  const isUsed = usedTileIndexes.includes(idx);
                  return (
                    <button
                      key={idx}
                      onClick={() => handleTileClick(letter, idx)}
                      disabled={isUsed}
                      className={`w-12 h-14 rounded-2xl font-black text-2xl flex items-center justify-center transition transform active:scale-95 shadow-md ${
                        isUsed
                          ? "bg-slate-900/40 text-slate-600 border border-slate-800 cursor-not-allowed opacity-30 scale-90"
                          : "bg-gradient-to-b from-cyan-400 to-teal-600 text-slate-950 font-extrabold hover:from-cyan-300 hover:to-teal-500 shadow-cyan-500/25 hover:-translate-y-0.5"
                      }`}
                    >
                      {letter}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Guess Input Slots */}
            <div className="mb-6">
              <span className="text-xs text-cyan-200/60 uppercase tracking-widest font-semibold block mb-2 text-center">
                Your Guess ({userGuess.length}/{currentWordObj?.word.length || 0})
              </span>
              <div className="flex items-center justify-center gap-2 min-h-[60px] bg-slate-900/80 border border-cyan-500/20 rounded-2xl p-2.5 shadow-inner">
                {currentWordObj?.word.split('').map((_, i) => {
                  const letter = userGuess[i] || "";
                  return (
                    <div
                      key={i}
                      className={`w-11 h-12 rounded-xl font-black text-xl flex items-center justify-center border transition ${
                        letter
                          ? "bg-cyan-500/20 text-cyan-300 border-cyan-400 shadow-sm"
                          : "bg-slate-950/60 border-slate-800 text-transparent"
                      }`}
                    >
                      {letter || "_"}
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Action Buttons */}
            <div className="grid grid-cols-3 gap-2.5 mb-4">
              <button
                onClick={handleBackspace}
                className="py-2.5 px-3 rounded-xl bg-slate-900/70 hover:bg-slate-800 border border-white/5 text-cyan-100 font-medium text-sm flex items-center justify-center gap-1 transition"
              >
                ⌫ Delete
              </button>
              <button
                onClick={handleReshuffle}
                className="py-2.5 px-3 rounded-xl bg-slate-900/70 hover:bg-slate-800 border border-white/5 text-cyan-100 font-medium text-sm flex items-center justify-center gap-1 transition"
              >
                🔀 Shuffle
              </button>
              <button
                onClick={handleClear}
                className="py-2.5 px-3 rounded-xl bg-slate-900/70 hover:bg-slate-800 border border-white/5 text-cyan-100 font-medium text-sm flex items-center justify-center gap-1 transition"
              >
                🔄 Reset
              </button>
            </div>

            {/* Submit Button */}
            <button
              onClick={handleCheck}
              disabled={userGuess.length === 0}
              className={`w-full py-3.5 rounded-2xl font-bold text-base shadow-lg transition transform active:scale-98 ${
                userGuess.length > 0
                  ? "bg-gradient-to-r from-teal-400 via-cyan-400 to-sky-400 hover:from-teal-300 hover:via-cyan-300 hover:to-sky-300 text-slate-950 shadow-cyan-500/30"
                  : "bg-slate-900 text-slate-600 border border-slate-800 cursor-not-allowed"
              }`}
            >
              ✓ Submit Guess (Enter)
            </button>

            {/* Extra Hint & Skip */}
            <div className="mt-4 pt-4 border-t border-white/10 flex items-center justify-between">
              <button
                onClick={handleRevealFirstLetter}
                disabled={revealedLetter}
                className={`text-xs font-semibold flex items-center gap-1.5 transition ${
                  revealedLetter
                    ? "text-slate-500 cursor-not-allowed"
                    : "text-amber-300 hover:text-amber-200"
                }`}
              >
                💡 {revealedLetter ? "First letter revealed" : "Reveal first letter (-3 pts)"}
              </button>

              <button
                onClick={handleSkip}
                className="text-xs font-medium text-cyan-200/60 hover:text-red-400 transition"
              >
                Skip Word ➔
              </button>
            </div>

            {/* Feedback Message */}
            {statusMessage.text && (
              <div
                className={`mt-4 p-3 rounded-xl text-center font-bold text-sm transition ${
                  statusMessage.type === "success"
                    ? "bg-teal-500/20 text-teal-200 border border-teal-400/40"
                    : "bg-red-500/20 text-red-200 border border-red-400/40"
                }`}
              >
                {statusMessage.text}
              </div>
            )}
          </div>

          <footer className="mt-8 text-center text-xs text-cyan-100/60 max-w-sm">
            Keyboard friendly: Type letters on your keyboard, press <kbd className="px-1.5 py-0.5 bg-slate-950/60 rounded text-cyan-200 border border-white/10">Enter</kbd> to submit, and <kbd className="px-1.5 py-0.5 bg-slate-950/60 rounded text-cyan-200 border border-white/10">Backspace</kbd> to delete.
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ScrambleApp />);
  </script>
</body>
</html>
